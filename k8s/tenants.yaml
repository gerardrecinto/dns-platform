# Two tenants. Each gets a namespace, a quota, default limits, default-deny network policy
# with DNS and same-namespace traffic allowed, and an RBAC group limited to its own namespace.
apiVersion: v1
kind: Namespace
metadata: {name: tenant-a, labels: {tenant: a}}
---
apiVersion: v1
kind: Namespace
metadata: {name: tenant-b, labels: {tenant: b}}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: quota, namespace: tenant-a}
spec: {hard: {requests.cpu: "500m", requests.memory: 512Mi, pods: "5"}}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: quota, namespace: tenant-b}
spec: {hard: {requests.cpu: "500m", requests.memory: 512Mi, pods: "5"}}
---
apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: tenant-a}
spec: {limits: [{type: Container, default: {cpu: 100m, memory: 64Mi}, defaultRequest: {cpu: 50m, memory: 32Mi}}]}
---
apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: tenant-b}
spec: {limits: [{type: Container, default: {cpu: 100m, memory: 64Mi}, defaultRequest: {cpu: 50m, memory: 32Mi}}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: tenant-a}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: tenant-b}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns-and-same-namespace, namespace: tenant-a}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {}}]
  egress:
    - to: [{podSelector: {}}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns-and-same-namespace, namespace: tenant-b}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {}}]
  egress:
    - to: [{podSelector: {}}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: tenant-dev, namespace: tenant-a}
rules: [{apiGroups: ["", apps], resources: [pods, pods/log, services, deployments, configmaps], verbs: [get, list, watch, create, update, delete]}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: tenant-dev, namespace: tenant-b}
rules: [{apiGroups: ["", apps], resources: [pods, pods/log, services, deployments, configmaps], verbs: [get, list, watch, create, update, delete]}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: tenant-dev, namespace: tenant-a}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: tenant-dev}
subjects: [{apiGroup: rbac.authorization.k8s.io, kind: Group, name: tenant-a-devs}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: tenant-dev, namespace: tenant-b}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: tenant-dev}
subjects: [{apiGroup: rbac.authorization.k8s.io, kind: Group, name: tenant-b-devs}]
