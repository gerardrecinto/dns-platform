groups:
  - name: dns
    rules:
      - alert: BindDown
        expr: bind_up == 0 or up{job="bind"} == 0
        for: 1m
        labels: {severity: page}
        annotations:
          summary: "BIND on {{ $labels.role }} is not answering statistics requests"
      - alert: BindResolverFailures
        expr: rate(bind_resolver_query_errors_total[5m]) > 1
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: "Resolver query errors on {{ $labels.role }}"
