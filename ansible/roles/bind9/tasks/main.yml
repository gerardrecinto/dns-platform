- name: Install BIND9
  ansible.builtin.apt:
    name: [bind9, bind9-utils, dnsutils]
    state: present

- name: Load the zone definition
  ansible.builtin.include_vars:
    file: "{{ zone_file }}"
    name: zone_def

- name: Create the log directory
  ansible.builtin.file:
    path: /var/log/named
    state: directory
    owner: bind
    group: bind
    mode: "0755"

- name: Write options
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: "0644"
    validate: "named-checkconf %s"
  notify: reload bind
  # named-checkconf validates the whole tree, so it checks the new options file in place.

- name: Write zone declarations and the transfer key
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: "0640"
  no_log: true
  notify: reload bind

- name: Check the full named configuration
  ansible.builtin.command: named-checkconf
  changed_when: false

- name: Write the primary zone file
  ansible.builtin.template:
    src: zone.db.j2
    dest: "/var/lib/bind/db.{{ zone_def.zone | regex_replace('\\.$', '') }}"
    owner: bind
    group: bind
    mode: "0644"
    validate: "named-checkzone {{ zone_def.zone }} %s"
  when: bind9_role == "primary"
  notify: reload bind
